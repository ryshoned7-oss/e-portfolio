<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/26958f40da.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- This section is the about me section -->

  <section id="about-me">
    <nav>
      <div class="personal__logo">Ryshone Duncan</div>
      <ul class="nav__link--list">
        <li>
          <a href="" class="
          nav__link--anchor
          link__hoover-effect
          link__hoover-effect--black
          ">Languages</a>
        </li> 
        <li>
          <a href="" class="
          nav__link--anchor
          link__hoover-effect
          link__hoover-effect--black
          ">Projects</a>
        </li> 
        <li>
          <a href="" class="
          nav__link--anchor
          nav__link--anchor-primary
          ">Contacts</a>
        </li>
      </ul>
    </nav>
   <div class="flex flex-1">
    <div class="about--me__info row">
      <div class="about--me__info--container">
        <figure class="about--me__picture--mask">
          <img src="./assets/IMG_1822.jpeg" class="about--me__picture" alt="picture of me">
        </figure>
        <h1 class="about--me__info--title">
           <span class="text--purple"></span>Hello! My name is Ryshone Duncan!
        </h1>
        <p class="about--me__info--para">I'm new here and still figuring things out but I'm looking foward to <strong class="text--purple"> learning new skills and making new friends!</strong>
        </p>
        <div class="about--me__links">
         
          <a href="" class="about--me__links">
          <i class="fa-brands fa-square-linkedin"></i>
          </a>

          <a href="" class="about--me__links">
          <i class="fa-brands fa-square-github"></i>
          </a>

          <a href="" class="about--me__links">
          <i class="fa-brands fa-square-letterboxd"></i>
          </a>

          <a href="" class="about--me__links">
          <i class="fa-solid fa-file-pdf"></i>
          </a>


        </div>
      </div>
      <figure class="about--me__img--container">
        <img src="./assets/undraw_in-progress.svg" class="about--me__img" alt="">
      </figure>
    </div>
   </div> 
  </section>

  <!--This section is devoted to the languages and presenting them on the home page of you e-portfolio  -->

  <section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my tech stack!</h1>
        <div class="language__list">

          <div class="language">
            <figure class="language__img--wrapper">
              <img src="./assets/html5-brands-solid-full.svg" alt="HTML" class="language__img">
            </figure>
            <span class="language__name">HTML</span>
          </div>

          <div class="language">
            <figure class="language__img--wrapper">
              <img src="./assets/css-brands-solid-full.svg" alt="CSS" class="language__img">
            </figure>
            <span class="language__name">CSS</span>
          </div>

             <div class="language">
            <figure class="language__img--wrapper">
              <img src="./assets/js-brands-solid-full.svg" alt="JavaScript" class="language__img">
            </figure>
            <span class="language__name">JavaScript</span>
            </div>

            <!-- This is where you will eventually add react to the list of languages that you can code -->

          </div>
        </div>
        </div>
      </div>
    </div>
  </section>

<!-- Below is where all of the project stuff will go -->

<section id="projects">
  <div class="container">
    <div class="row">
      <h1 class="section__title">Here are some of my <span class="text--purple"></span>projects!</h1>
